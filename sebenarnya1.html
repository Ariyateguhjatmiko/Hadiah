
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Interactive Story</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    background-color: pink;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    text-align: center;
  }
  /* Semua tombol dengan logo love di pojok */
  button.love-button {
    position: relative;
    background-color: pink;
    color: white;
    border: 2px solid white;
    border-radius: 5px;
    padding: 10px 25px;
    font-size: 18px;
    cursor: pointer;
    margin: 30px;
    user-select: none;
    transition: background-color 0.3s, color 0.3s;
  }
  button.love-button:hover {
    background-color: white;
    color: pink;
  }
  button.love-button::before,
  button.love-button::after {
    content: '❤️';
    position: absolute;
    font-size: 18px;
    user-select: none;
    pointer-events: none;
    z-index: 1;
  }
  button.love-button::before {
    bottom: 2px;
    left: 2px;
  }
  button.love-button::after {
    top: 2px;
    right: 2px;
  }

  #yesButton.love-button {
    margin: 0 15px;
    padding: 10px 30px;
    font-weight: bold;
  }
  #noButton.love-button {
    margin: 0 15px;
    padding: 10px 30px;
    font-weight: bold;
    position: relative;
    opacity: 1;
    user-select: none;
    transition: opacity 0.3s, transform 0.3s;
  }
  .final-message {
    color: maroon;
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 15px;
  }
  .hearts {
    font-size: 50px;
    line-height: 0.6;
    user-select: none;
  }
  #proposalText {
    font-size: 32px;
    font-weight: bold;
    margin-bottom: 20px;
  }
</style>
</head>
<body>
  <div id="content">
    <button id="startButton" class="love-button">START</button>
  </div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const contentDiv = document.getElementById('content');

    function showTextWithDelay(text, delay, callback) {
      contentDiv.textContent = text;
      setTimeout(() => {
        if (callback) callback();
      }, delay);
    }

    function runNumberSequence() {
      showTextWithDelay('(1)', 1000, () => {
        showTextWithDelay('(2)', 1000, () => {
          showTextWithDelay('(3)', 1000, () => {
            contentDiv.innerHTML = '';
            const divText = document.createElement('div');
            divText.textContent = '(Aku.....)';
            contentDiv.appendChild(divText);
            const lanjutButton = document.createElement('button');
            lanjutButton.id = 'lanjutButton';
            lanjutButton.className = 'love-button';
            lanjutButton.textContent = 'LANJUT';
            contentDiv.appendChild(lanjutButton);
            lanjutButton.addEventListener('click', pageSuka);
          });
        });
      });
    }

    function pageSuka() {
      contentDiv.innerHTML = '';
      const divText = document.createElement('div');
      divText.textContent = 'Sebenarnya udah suka kamu dari lama..';
      contentDiv.appendChild(divText);
      const jadiButton = document.createElement('button');
      jadiButton.id = 'jadiButton';
      jadiButton.className = 'love-button';
      jadiButton.textContent = 'Jadi....';
      contentDiv.appendChild(jadiButton);
      jadiButton.addEventListener('click', pageTawaran);
    }

    function pageTawaran() {
      contentDiv.innerHTML = '';
      const proposal = document.createElement('div');
      proposal.id = 'proposalText';
      proposal.textContent = 'Mau gak kamu jadi pacarku?';
      contentDiv.appendChild(proposal);

      const btnContainer = document.createElement('div');
      btnContainer.style.display = 'flex';
      btnContainer.style.justifyContent = 'center';
      btnContainer.style.alignItems = 'center';

      const yesButton = document.createElement('button');
      yesButton.id = 'yesButton';
      yesButton.className = 'love-button';
      yesButton.textContent = 'YES';

      const noButton = document.createElement('button');
      noButton.id = 'noButton';
      noButton.className = 'love-button';
      noButton.textContent = 'NO';
      noButton.style.position = 'relative';
      noButton.style.opacity = '1';
      noButton.style.transition = 'opacity 0.3s, transform 0.3s';

      btnContainer.appendChild(yesButton);
      btnContainer.appendChild(noButton);
      contentDiv.appendChild(btnContainer);

      let distance = 0;
      let opacity = 1;

      noButton.addEventListener('click', () => {
        if (distance < 200) {
          distance += 20;
          noButton.style.transform = `translateX(${distance}px)`;
        }
        if (opacity > 0) {
          opacity = Math.max(0, opacity - 0.1);
          noButton.style.opacity = opacity;
        }
      });

      yesButton.addEventListener('click', finalPage);
    }

    function finalPage() {
      contentDiv.innerHTML = '';
      const finalMsg = document.createElement('div');
      finalMsg.className = 'final-message';
      finalMsg.textContent = 'SELAMAT! KAMU TELAH RESMI MENJADI PACARKU, BERITAHU AKU YA!!';
      contentDiv.appendChild(finalMsg);

      const heartsLine1 = document.createElement('div');
      heartsLine1.className = 'hearts';
      heartsLine1.textContent = '❤️ ❤️ ❤️ ❤️ ❤️';
      contentDiv.appendChild(heartsLine1);

      const heartsLine2 = document.createElement('div');
      heartsLine2.className = 'hearts';
      heartsLine2.textContent = '❤️ ❤️ ❤️ ❤️ ❤️';
      contentDiv.appendChild(heartsLine2);
    }

    const startBtn = document.getElementById('startButton');
    startBtn.addEventListener('click', () => {
      runNumberSequence();
    });
  });
</script>

</body>
</html>
